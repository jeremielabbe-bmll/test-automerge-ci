name: Auto Update PR Branch (auto-merge enabled)

# Mirrors bmlltech/jobserve PR #8881's version of .github/workflows/auto-update-branch.yml,
# adapted for this scratch repo: runs-on ubuntu-latest instead of the self-hosted
# bmll-always-on-small runner, base branch is main instead of master.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - auto_merge_enabled

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-prs
  cancel-in-progress: true

jobs:
  update-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Update branches for PRs with auto-merge enabled
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 #v9.0.0
        with:
          script: |
            const targetPRs = context.eventName === 'pull_request'
              ? [context.payload.pull_request.number]
              : (await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: 'main',
                  state: 'open',
                  per_page: 100,
                })).map((pr) => pr.number);

            for (const number of targetPRs) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              if (!pr.auto_merge) {
                core.info(`Skipping #${number}: auto-merge not enabled`);
                continue;
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: number,
                });
                core.info(`Requested branch update for #${number}`);
              } catch (error) {
                core.warning(`Failed to update branch for #${number}: ${error.message}`);
              }
            }
